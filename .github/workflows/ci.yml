name: CI

# Verify the project builds and passes checks on every push and pull request.
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: MyGo vet
        run: go tool mygo vet ./

  build-check:
    name: Build check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build Linux artifact
        run: go tool mygo build -platform linux/amd64 -o build
