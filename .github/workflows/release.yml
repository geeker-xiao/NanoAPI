name: Release

# Build NanoAPI for every desktop platform with MyGo and publish a GitHub
# Release with the installers whenever a tag like `v1.2.3` is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            out: windows-amd64
            archive: zip
          - os: macos-latest
            platform: darwin/universal
            out: darwin-universal
            archive: tar
          - os: ubuntu-latest
            platform: linux/amd64
            out: linux-amd64
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Read version from mygo.json
        id: version
        shell: bash
        run: |
          ver=$(grep '"version"' mygo.json | head -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building version $ver for ${{ matrix.platform }}"

      - name: Build with MyGo
        # MyGo needs no cgo, so any platform can be compiled from any runner.
        # However, the platform-specific packaging (NSIS installer on Windows,
        # .dmg/.app on macOS, .deb on Linux) still requires the native runner.
        run: go tool mygo build -platform ${{ matrix.platform }} -o build

      - name: Package artifact (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/${{ matrix.out }}\*" `
            -DestinationPath "build/NanoAPI-${{ steps.version.outputs.version }}-${{ matrix.out }}.zip"

      - name: Package artifact (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          tar -czf "build/NanoAPI-${{ steps.version.outputs.version }}-${{ matrix.out }}.tar.gz" \
            -C "build/${{ matrix.out }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: build/NanoAPI-${{ steps.version.outputs.version }}-${{ matrix.out }}.*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version output lives in the build matrix job and cannot be read
      # here, so derive it from the pushed tag (v1.2.3 -> 1.2.3).
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pull the matching `## [x.y.z]` section out of CHANGELOG.md so the
      # release notes live in the repo and never drift from what ships.
      - name: Extract changelog for this version
        run: |
          ver="${{ steps.version.outputs.version }}"
          awk -v v="$ver" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" v "\\]") { found = 1; print; next }
            }
            found { print }
          ' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            echo "No CHANGELOG entry for v$ver; falling back to generated notes." > changes.md
          fi
          echo "---- changes.md ----"
          cat changes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NanoAPI v${{ steps.version.outputs.version }}
          body_path: changes.md
          files: artifacts/*
